<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="427" viewBox="0 0 980 427" role="img" aria-labelledby="title desc"><title id="title">SQLite Sync Guard demo output</title><desc id="desc">A normalized recording from sqlite-sync-guard demo. The temporary workspace path is replaced with demo-workspace.</desc><rect width="980" height="427" fill="#182922"/><rect width="980" height="62" fill="#0B5B53"/><circle cx="28" cy="31" r="8" fill="#E8C2B8"/><circle cx="54" cy="31" r="8" fill="#F3E9D5"/><text x="82" y="37" fill="#FFF9EC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700">$ sqlite-sync-guard demo</text><g fill="#FFF9EC" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17"><text x="28" y="42">DEMO — bundled sample data; output stays in the workspace printed below.</text><text x="28" y="67"> </text><text x="28" y="92">UNSAFE  active-session.db</text><text x="28" y="117">        - WAL sidecar present</text><text x="28" y="142">SAFE  closed-project.db</text><text x="28" y="167"> </text><text x="28" y="192">DO NOT SYNC — 1 of 2 database set(s) are unsafe to copy live.</text><text x="28" y="217">Close writers or run `sqlite-sync-guard export &lt;db&gt; --output &lt;dir&gt;`. </text><text x="28" y="242"> </text><text x="28" y="267">TRANSFER BACKUP CREATED</text><text x="28" y="292">  backup:   &lt;demo-workspace&gt;/transfer/closed-project.backup.sqlite3</text><text x="28" y="317">  manifest: &lt;demo-workspace&gt;/transfer/closed-project.backup.manifest.json</text><text x="28" y="342">  workspace: &lt;demo-workspace&gt;</text><text x="28" y="367">Delete this temporary workspace when you are finished.</text><text x="28" y="392"> </text></g></svg>
