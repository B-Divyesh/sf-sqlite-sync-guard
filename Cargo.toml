[package]
name = "sqlite-sync-guard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Preflight SQLite files before folder sync and export consistent handoff snapshots"
license = "MIT"
readme = "README.md"
repository = "https://github.com/B-Divyesh/sf-sqlite-sync-guard"
keywords = ["sqlite", "syncthing", "backup", "wal", "cli"]
categories = ["command-line-utilities", "database"]
exclude = ["dist/", "node_modules/", "site/public/*-source.png"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
walkdir = "2.5"
tempfile = "3.21"

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
